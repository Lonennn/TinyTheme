name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: build (${{ matrix.preset }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主路径：最新镜像的 Release，唯一跑全集（单测、格式、依赖、体积）的变体
          - os: windows-2025
            preset: x64-release
            test: true
            checks: true
            upload: true
          # Debug：/RTC1、断言、迭代器调试只在 Debug 生效
          - os: windows-2025
            preset: x64-debug
            test: true
          # 跨架构：只验证能编出 ARM64
          - os: windows-2025
            preset: arm64-release
            upload: true
          # 最低工具链：v143 只存在于 windows-2022，windows-2025 已换成 VS 2026
          - os: windows-2022
            preset: x64-release
            test: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # vcvarsall 的参数是“宿主机_目标机”。裸 arm64 表示在 ARM64 宿主机上原生编译，
          # x64 runner 上它既不报错、也给不出编译器。
          # 不钉 vsversion：插件的年份表止于 2022，而 windows-2025 现在由
          # windows-2025-vs2026 承载（VS 18 / MSVC 14.51），钉住只会让它找不到 VS。
          arch: ${{ startsWith(matrix.preset, 'arm64') && 'amd64_arm64' || 'amd64' }}

      - name: Verify toolchain
        shell: pwsh
        run: |
          # 目标工具集缺失时 vcvarsall 会静默退回 x64 编译器，所以不能只看上一步是否成功；
          # 也不能靠 cl 的版本横幅——中文 VS 下那是本地化文本。用解析到的编译器路径判断。
          $cl = (Get-Command cl -ErrorAction SilentlyContinue).Source
          if (-not $cl) {
            Write-Error 'cl 不在 PATH 上'
            exit 1
          }
          Write-Host "cl: $cl"
          Write-Host "VSCMD_ARG_HOST_ARCH=$env:VSCMD_ARG_HOST_ARCH TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"
          Write-Host "VCToolsVersion=$env:VCToolsVersion VSCMD_VER=$env:VSCMD_VER VisualStudioVersion=$env:VisualStudioVersion"
          $expected = ('${{ matrix.preset }}' -like 'arm64*') ? 'arm64' : 'x64'
          if ($cl -notmatch "\\$expected\\cl\.exe$") {
            Write-Error "cl 不是 $expected 目标：$cl"
            exit 1
          }
          exit 0

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.test
        run: ctest --preset ${{ matrix.preset }}

      - name: Format check
        if: matrix.checks
        shell: pwsh
        run: |
          $files = Get-ChildItem src,tests -Recurse -Include *.cpp,*.h |
            Where-Object { $_.FullName -notmatch 'third_party' }
          $bad = @()
          foreach ($f in $files) {
            $formatted = & clang-format --style=file $f.FullName | Out-String
            $original = Get-Content -Raw $f.FullName
            if (($formatted -replace "`r`n","`n").TrimEnd() -ne ($original -replace "`r`n","`n").TrimEnd()) {
              $bad += $f.FullName
            }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "需要 clang-format：$_" }
            exit 1
          }

      - name: Dependency check
        if: matrix.checks
        shell: pwsh
        run: |
          $exe = 'build/x64-release/TinyTheme.exe'
          $imports = & dumpbin /dependents $exe
          $imports | Write-Host
          if ($imports -match 'VCRUNTIME|MSVCP') {
            Write-Error '出现了动态 C 运行库依赖，/MT 未生效'
            exit 1
          }
          $network = & dumpbin /imports $exe | Select-String -Pattern 'WS2_32|WININET|WINHTTP|URLMON'
          if ($network) {
            Write-Error '出现网络相关导入'
            exit 1
          }

      - name: Size report
        if: matrix.checks
        shell: pwsh
        run: |
          $size = (Get-Item 'build/x64-release/TinyTheme.exe').Length
          Write-Host "TinyTheme.exe = $size bytes"
          $line = "| $(Get-Date -Format 'yyyy-MM-dd') | $size | $env:GITHUB_SHA |"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "`n`n| 日期 | 体积(字节) | 提交 |`n|---|---|---|`n$line"

      - name: Upload artifact
        # 只有主路径与 ARM64 变体上传：同名 artifact 不能重复，
        # windows-2022 那一条只用来验证工具链。
        if: matrix.upload
        uses: actions/upload-artifact@v4
        with:
          name: TinyTheme-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/TinyTheme.exe
          if-no-files-found: error

  package:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: TinyTheme-x64-release
          path: build/x64-release

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          pwsh -File tools/package.ps1 -Version $version -Exe build/x64-release/TinyTheme.exe -Generator ninja

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: TinyTheme-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
